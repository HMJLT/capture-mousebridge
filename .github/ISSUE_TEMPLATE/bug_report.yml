name: Bug report
description: Report a reproducible CaptureMouseBridge or ESP32 issue
title: "[bug] "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include board model, Windows version, connection mode, and exact steps. Never include passwords or private IPs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
